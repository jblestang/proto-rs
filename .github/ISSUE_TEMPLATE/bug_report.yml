name: Bug report
description: Report an incorrect schema, codec, or sanitization behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        For security-sensitive reports, stop here and use the private process
        in SECURITY.md.

  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the schema, wire bytes, options, and Rust code needed to reproduce it.
      render: rust
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or a Git commit
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain and target
      placeholder: rustc 1.88.0, thumbv7em-none-eabihf
    validations:
      required: true
